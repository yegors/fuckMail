[package]
name = "fm-mail"
description = "MIME parsing, text and HTML extraction and message construction for fuckMail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ammonia = "4.1.4"
cssparser = "0.38"
html5ever = "0.40"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
markup5ever_rcdom = "=0.39.0"
url = "2.5"
lettre = { version = "0.11.23", default-features = false, features = ["builder"] }
mail-parser = "1.0"
regex = "1.13"
sha2 = "0.11.1"

[dev-dependencies]
fm-google = { path = "../fm-google" }
serde_json = "1.0"
