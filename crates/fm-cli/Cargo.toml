[package]
name = "fm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
verification-google = []

[[bin]]
name = "fm"
path = "src/main.rs"

[dependencies]
fm-ipc = { path = "../fm-ipc" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
