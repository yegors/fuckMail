[package]
name = "fm-engine"
description = "Local fuckMail engine process: Google sync, IPC server and background work"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fm-assist = { path = "../fm-assist" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
fm-mail = { path = "../fm-mail" }
mail-parser = "0.11"
url = "2.5"
fm-core = { path = "../fm-core" }
fm-ipc = { path = "../fm-ipc" }
fm-google = { path = "../fm-google" }
fm-calendar = { path = "../fm-calendar" }
chrono = "0.4"
chrono-tz = "0.10"
base64 = "0.23"
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.14.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
jsonwebtoken = { version = "=11.1.0", default-features = false }
tempfile = "3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
