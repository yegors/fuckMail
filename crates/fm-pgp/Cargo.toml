[package]
name = "fm-pgp"
description = "OpenPGP keys, PGP/MIME signing, encryption, decryption and verification for fuckMail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
mail-parser = "0.11"
pgp = "=0.21.0"
rand = "0.8.6"
serde = { version = "1.0", features = ["derive"] }
smallvec = "1"
zeroize = "1.8.1"

[dev-dependencies]
fm-mail = { path = "../fm-mail" }
sha2 = "0.10.8"
