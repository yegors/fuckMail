[package]
name = "fm-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[dependencies]
chrono = "0.4"
fm-calendar = { path = "../fm-calendar" }
fm-google = { path = "../fm-google" }
fm-mail = { path = "../fm-mail" }
fs2 = "0.4.3"
mail-parser = "0.11"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
