[package]
name = "fm-core"
description = "SQLite store and single-writer domain logic shared by the fuckMail GUI and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22.1"
chrono = "0.4"
fm-assist = { path = "../fm-assist" }
fm-calendar = { path = "../fm-calendar" }
fm-google = { path = "../fm-google" }
fm-mail = { path = "../fm-mail" }
fs2 = "0.4.3"
mail-parser = "0.11"
rusqlite = { version = "0.32.1", features = ["bundled", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
