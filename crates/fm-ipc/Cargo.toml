[package]
name = "fm-ipc"
description = "Local pipe/socket transport and engine discovery for fuckMail clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10.2"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
