[package]
name = "fm-google"
description = "Google OAuth, Gmail and Calendar HTTP clients and OS keychain storage for fuckMail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
http-body = "1.1.0"
oauth2 = { version = "5.0.0", default-features = false, features = ["timing-resistant-secret-traits"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
tokio = { version = "1.53.1", features = ["net", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
httpdate = "=1.0.3"
jsonwebtoken = { version = "=11.1.0", default-features = false }
zeroize = "1.8.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
