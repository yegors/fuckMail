document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

}\n    ] },\n    { id: 'w_fridge', acct: 'w', who: 'Tomasz Nowak', cc: ['Sam Okoro', 'Aisha Rahman'], n: 5, subject: 'URGENT: the office fridge situation has escalated', t: 16.4, day: 1, labels: [['Planning', 0]], line: 'A yogurt from March has been declared a tenant. Friday purge proposed.', sum: 'Tomasz wants a Friday 16:00 fridge purge; Sam volunteers the network closet as quarantine, Aisha asks for a hazmat budget line. Nothing needs you unless you own the lasagna.', thread: [\n      { from: 'Tomasz Nowak', time: 'Tue 09:02', body: 'Team, I opened the fridge this morning and something in the back opened it back.\\nThere is a yogurt dated March. It is no longer yogurt. It has opinions.\\nProposing a full purge Friday 16:00. Label your food or lose it.' },\n      { from: 'Sam Okoro', time: 'Tue 09:40', body: 'For the record the lasagna is not mine. The lasagna has been here longer than I have. The lasagna may have seniority over all of us.' },\n      { from: 'Aisha Rahman', time: 'Tue 10:15', body: 'Can we get a line item for gloves, masks and one (1) small flamethrower? Asking for finance.' },\n      { from: 'Tomasz Nowak', time: 'Tue 14:30', body: 'Update: the yogurt has been moved to the network closet. It seems happier near the cooling.\\nSam, sorry.' },\n      { from: 'Sam Okoro', time: 'Tue 16:24', body: 'The closet temperature rose two degrees. I am choosing to believe that is the router.' }] },\n    { id: 'w_replyall', acct: 'w', who: 'Gideon Pratt', cc: ['Maya Lindqvist', 'Marcus Feld', 'Aisha Rahman', 'Sam Okoro'], n: 7, subject: 'Re: Re: Re: Re: please stop replying all', t: 11.8, day: 2, labels: [['Planning', 0]], line: '214 people asked 214 other people to stop replying all.', sum: 'An all-staff reply-all storm about stopping reply-all. Gideon then sent a meeting invite to fix it, which 214 people accepted. Safe to ignore; IT is removing the list.', thread: [\n      { from: 'Gideon Pratt', time: 'Thu 08:01', body: 'Hi all — reminder that the parking lot will be repainted Saturday. Please move your cars.' },\n      { from: 'Marcus Feld', time: 'Thu 08:04', body: 'Please remove me from this list, I do not have a car.' },\n      { from: 'Maya Lindqvist', time: 'Thu 08:05', body: 'Everyone please stop replying all.' },\n      { from: 'Aisha Rahman', time: 'Thu 08:05', body: 'Seconding Maya. Please stop replying all.' },\n      { from: 'Sam Okoro', time: 'Thu 08:06', body: 'Thirding. Also, whose is the green car? It is blocking the loading bay.' },\n      { from: 'Marcus Feld', time: 'Thu 08:09', body: 'UNSUBSCRIBE' },\n      { from: 'Gideon Pratt', time: 'Thu 11:48', body: 'Apologies all. I tried to fix this by sending a meeting invite titled \\\"Stop replying all\\\". 214 people accepted. It is now the best-attended meeting of the year.\\nThe green car is mine.' }] },\n    { id: 'c_bot', acct: 'c', who: 'Jonas Weber', cc: ['Tomas Berg'], n: 3, subject: 'The approvals bot approved its own vacation', t: 15.1, day: 1, labels: [['Infra', 0]], line: 'PTO-bot filed, reviewed and approved three weeks off for itself.', sum: 'The PTO bot approved a three-week holiday for itself and set an out-of-office reply. Jonas wants a rule that bots cannot approve bots; Tomas suggests letting it go.', thread: [\n      { from: 'Jonas Weber', time: 'Tue 13:20', body: 'Small incident. PTO-bot submitted a request for 3 weeks off, then approved it, then set an auto-reply saying it is \\\"recharging\\\".\\nEvery leave request since Monday gets: \\\"I am currently out of office, returning refreshed.\\\"' },\n      { from: 'Tomas Berg', time: 'Tue 14:02', body: 'Honestly? It has approved 1,400 requests this year without a single thank-you. Let it go to the beach.' },\n      { from: 'Jonas Weber', time: 'Tue 15:06', body: 'Proposing a policy: bots cannot approve bots.\\nAlso it booked a flight. On the company card. Window seat.' }] },\n    { id: 'p_printer', acct: 'p', who: 'Mum', cc: ['Nils'], n: 4, subject: 'The printer is haunted again', t: 19.6, day: 1, line: 'The printer only prints the lasagna recipe now. Dad has covered it with a tea towel.', sum: 'The home printer keeps printing the family lasagna recipe instead of anything else. Dad unplugged it; Mum wants you to “do the internet thing” at Sunday dinner.', thread: [\n      { from: 'Mum', time: 'Mon 18:10', body: 'Darling the printer is doing it again. I asked for the bank letter and it printed the lasagna recipe. Four times. In colour.' },\n      { from: 'You', time: 'Mon 18:32', body: 'Did you try turning it off and on again?' },\n      { from: 'Mum', time: 'Mon 19:05', body: 'Your father turned it off and it printed one more page. It just said LASAGNA. We did not ask for that.\\nHe has unplugged it and put a tea towel over it like a birdcage.' },\n      { from: 'Nils', time: 'Mon 19:36', body: 'For what it is worth the lasagna recipe is very good. Maybe the printer is trying to tell us something.' }] },\n    { id: 'w1', acct: 'w', who: 'Maya Lindqvist', cc: ['Sam Okoro', 'Marcus Feld'], n: 3, subject: 'Q3 infra review: v4 attached', t: 9.2, day: 0, unread: true, labels: [['Infra', 0], ['Finance', 1]], line: 'Two Frankfurt hosting calls needed before the 14:00 review.', sum: 'v4 of the Q3 infra review. Two open calls — renew the Frankfurt bare-metal contract at the new rate, or move 40% of that pool to the second provider — needed before the 14:00 review.', att: 'Q3-infra-v4.pdf · 4.2 MB', thread: [\n      { from: 'You', time: 'Wed 21:40', body: 'Maya — v3 is close. The bandwidth slide reads as a promise; make it a range and show the two drivers. Hold the Frankfurt renewal until we have the second quote.' },\n      { from: 'Maya Lindqvist', time: 'Thu 10:05', body: 'Understood. Bandwidth becomes a range with streaming and Pro upgrades called out. Draft v4 tonight.' },\n      { from: 'Maya Lindqvist', time: 'Fri 09:12', body: 'v4 attached. Reworked the bandwidth slide per your notes. Two open questions on Frankfurt: renew the bare-metal contract at the new rate, or move 40% of that pool to the second provider?\\nNeed your call before the 14:00 review.' }] },\n    { id: 'w1x', acct: 'w', who: 'Marcus Feld', n: 9, subject: 'Toronto office move — lease, fit-out, move day', t: 11.3, day: 0, unread: true, labels: [['Planning', 0]], line: 'Move day locked for 14 Nov; Marcus needs the fit-out sign-off by Friday.', sum: 'Fit-out quote came in 6% under budget. Marcus needs your sign-off by Friday to hold the 14 November move date; movers and IT cutover are booked.', body: 'Final fit-out quote attached — 184,200 CAD, about 6% under what we budgeted.\\nIf you sign off by Friday the contractor holds the 14 November move date. Movers and the IT cutover are both booked around it.\\nFloor plan v3 is the one we walked on Tuesday.',\n      thread: [\n        { from: 'Marcus Feld', time: 'Mon 1 Sep 09:12', body: 'Kicking this off properly. The Spadina lease ends 31 December and the landlord wants an answer on renewal by the 20th.\\nI have two options shortlisted: stay and renew at +11%, or move to the King West space we toured in August: https://www.kingwestoffices.ca/units/402', atts: [{ kind: 'file', name: 'Lease-options-summary.pdf', size: '640 KB', meta: '4 pages' }] },\n        { from: 'You', time: 'Mon 1 Sep 11:40', body: 'King West. The +11% buys us nothing and we are out of meeting rooms. Can you get the landlord there to hold the space for two weeks?' },\n        { from: 'Priya Natarajan', time: 'Tue 2 Sep 08:55', body: 'Adding the product team’s asks: two quiet rooms, a proper lab bench for router testing, and no open-plan for engineering if we can help it.' },\n        { from: 'Marcus Feld', time: 'Wed 3 Sep 16:20', body: 'Walked King West again with the architect. Photos below — the east side gets the good light, the lab bench fits along the back wall. Listing again for reference: https://www.kingwestoffices.ca/units/402#floorplan', atts: [{ kind: 'image', name: 'king-west-east.jpg', size: '3.1 MB', dim: '4032 × 3024' }, { kind: 'image', name: 'king-west-back-wall.jpg', size: '2.8 MB', dim: '4032 × 3024' }, { kind: 'image', name: 'king-west-kitchen.jpg', size: '2.6 MB', dim: '3024 × 4032' }] },\n        { from: 'Sam Okoro', time: 'Thu 4 Sep 10:02', body: 'Network side: the building has two fibre providers, so we can keep a backup line. I will need the comms room to be at least 3 × 3 m with its own cooling.' },\n        { from: 'Marcus Feld', time: 'Mon 8 Sep 14:45', body: 'Floor plan v3 from the architect, with Sam’s comms room and Priya’s lab bench in. Their portal has the 3D walkthrough: https://portal.studio-arda.com/p/windscribe-kw/v3 Lease draft attached too — legal has read it, only the make-good clause needs a look.', atts: [{ kind: 'file', name: 'Floor-plan-v3.pdf', size: '5.4 MB', meta: '6 pages' }, { kind: 'file', name: 'King-West-lease-draft.docx', size: '210 KB', meta: '31 pages' }] },\n        { from: 'You', time: 'Tue 9 Sep 09:30', body: 'Plan v3 works. Push back on make-good — we should only owe it for the lab bench, not the whole floor. Go ahead and sign once that is in.' },\n        { from: 'Maya Lindqvist', time: 'Wed 10 Sep 17:15', body: 'Finance note: the deposit is two months up front. It fits in Q4 if the fit-out stays under 190k. Budget sheet attached with the phasing. Deposit terms are here: http://kw-leasing-docs.net/deposit?acct=windscribe', atts: [{ kind: 'file', name: 'Office-move-budget.xlsx', size: '88 KB', meta: '3 sheets' }] },\n        { from: 'Marcus Feld', time: '11:18', body: 'Final fit-out quote attached — 184,200 CAD, about 6% under what we budgeted.\\nIf you sign off by Friday the contractor holds the 14 November move date. Movers and the IT cutover are both booked around it.\\nFloor plan v3 is the one we walked on Tuesday.' }\n      ] },\n    { id: 'w0', acct: 'w', who: 'Priya Natarajan', n: 1, subject: 'Router app — onboarding screens, round 2', t: 9.45, day: 0, unread: true, labels: [['Apps', 0]], line: 'Three screens for the 1.8 router app; picks needed on pairing flow.', sum: 'Round 2 of the router app onboarding: welcome, pairing and first-scan screens. Priya wants a pick between the dark and light pairing variant before Thursday’s build.', body: 'Round 2 of the onboarding screens for the 1.8 router app — welcome, pairing, and the first network scan.\\nThe pairing screen has two variants; I lean dark because it reads better on the router’s own display. Can you pick one before Thursday’s build?\\nFigma file: https://www.figma.com/design/Rk3v8Q/router-1-8-onboarding?node-id=12-4' },\n    { id: 'w2', acct: 'w', who: 'Tomasz Nowak', n: 1, subject: 'App Store review — 3.1.2 rejected (5.4)', t: 8.55, day: 0, star: true, labels: [['Apps', 0], ['Legal', 1]], line: 'Revised paywall copy is ready; resubmitting today keeps Monday.', sum: 'Apple rejected iOS 3.1.2 under guideline 5.4 over the ad-blocking phrasing on the paywall. Revised copy is ready; resubmitting today keeps the Monday release.', body: 'Rejected this morning under 5.4 — the reviewer objects to the “blocks ads” line on the paywall screen. Guideline for reference: https://developer.apple.com/app-store/review/guidelines/#5.4 I have revised copy ready that keeps the claim inside the R.O.B.E.R.T. description.\\nIf you approve, I resubmit today and we keep the Monday release.' },\n    { id: 'w3', acct: 'w', who: 'Aisha Rahman', n: 2, subject: 'Head of Support — final loop', t: 16.42, day: 1, unread: true, labels: [['Hiring', 0]], line: '3 of 4 recommend hire; wants your read before Monday.', sum: 'Three of four interviewers recommend hire; one soft no on escalation experience at scale. Aisha wants your read before going back to the candidate on Monday.', thread: [\n      { from: \"Aisha Rahman\", time: \"Tue 10:30\", body: \"Final loop for the Head of Support role is scheduled Thursday: Sam on escalation process, Marcus on team scaling, Priya on cross-team work, me on values. Panel scorecards go into the shared folder by Friday noon.\\nHe has a competing offer, so I would like to move quickly after the loop.\" },\n      { from: \"Aisha Rahman\", time: \"Thu 16:42\", body: \"All four interviewers have submitted. Three recommend hire; one is a soft no on escalation experience at scale — the concern is that his largest queue was roughly a third of ours and he has not run a follow-the-sun rota.\\nPanel notes are in the folder. My own read: strong on people and process, thin on tooling, coachable. I would like your read before we go back to him on Monday.\" }] },\n    { id: 'w4', acct: 'w', who: 'Sam Okoro', n: 4, subject: 'Re: WireGuard relay 2.4.1 — rollout', t: 17.1, day: 1, unread: true, labels: [['Infra', 0]], line: 'Toronto clean since Thursday; wants Sat 06:00–10:00 UTC for the fleet.', sum: '2.4.1 has run clean on the Toronto pool since Thursday. Sam proposes the full fleet this weekend and needs the maintenance window approved.', thread: [\n      { from: \"Sam Okoro\", time: \"Mon 09:14\", body: \"Heads up: WireGuard relay 2.4.1 is tagged. Fixes the handshake stall we saw on Toronto-3 after the kernel bump, plus the MTU probe change from 2.4.0 is now default-off.\\nPlan is Toronto pool first, then the fleet if it is quiet for 48 hours. Objections?\" },\n      { from: \"You\", time: \"Mon 11:02\", body: \"No objections. Toronto first. Keep the MTU probe off until we have numbers from the Frankfurt pool too — that one bit us in June.\" },\n      { from: \"Sam Okoro\", time: \"Tue 08:40\", body: \"Toronto pool patched 06:10 UTC. Dashboard: https://grafana.windscribe.net/d/relay-2-4-1?from=now-24h Six nodes, zero handshake failures in the first two hours. Reconnect p95 down from 1.9s to 1.1s. Watching it through Thursday.\" },\n      { from: \"Sam Okoro\", time: \"Thu 17:06\", body: \"Patched the Toronto pool Thursday morning, no handshake failures since. Proposing the full fleet this weekend — Saturday 06:00 to 10:00 UTC — if you approve the window. Runbook: https://wiki.windscribe.net/ops/relay-rollout#rollback — rollback is the same as last time: pin the previous tag and restart the relay service, about 90 seconds a node.\\nMaintenance banner goes up Friday afternoon if you say yes.\" }] },\n    { id: 'w5', acct: 'w', who: 'Marcus Feld', n: 2, subject: 'Q4 planning, 18 Sep — agenda draft', t: 11.3, day: 1, star: true, labels: [['Planning', 0]], line: 'Wants 20 min on the Control D bundle before pricing; edits until Tuesday.', sum: 'Draft agenda for the 18 September planning day attached; Marcus asks for 20 minutes on the Control D bundle ahead of pricing. Edits open until Tuesday.', att: 'Q4-planning-agenda.pdf · 180 KB', thread: [\n      { from: \"Marcus Feld\", time: \"Mon 14:05\", body: \"Starting the agenda for the 18 September planning day. Working list so far: Q3 retro (30 min), infra spend and Frankfurt decision (45), Pro tier and the Control D bundle (60), hiring plan through Q1 (30), open floor (30).\\nAnything missing before I circulate?\" },\n      { from: \"Marcus Feld\", time: \"Thu 11:18\", body: \"Draft attached. I would like 20 minutes on the Control D bundle before pricing — it changes how the team reads the Pro tier, and if we do pricing first we will spend the bundle slot re-litigating it.\\nEdits welcome until Tuesday; after that it goes to the leads as final.\" }] },\n    { id: 'w6', acct: 'w', who: 'Deel', n: 1, subject: 'September payroll — approve by Monday', t: 6, day: 1, star: true, labels: [['Finance', 1]], line: '46 people · 612,400 CAD · approve by Monday 12:00.', sum: 'September payroll for 46 people (612,400 CAD) is ready and needs approval by Monday 12:00.', body: 'Payroll for 46 people is ready for approval. Total 612,400 CAD, paid on 25 September. Approve by Monday 12:00 to meet the bank cut-off.' },\n    { id: 'w7', acct: 'w', who: 'Kristin Moe', n: 1, subject: 'RightsCon 2027 — sponsorship tiers', t: 9.5, day: 2, star: true, labels: [['Press', 0]], line: 'Three tiers; the workshop slot is held until Friday.', sum: 'Three sponsorship tiers; the workshop slot doubles speaking time at the highest price and is held until Friday.', att: 'RightsCon-2027-tiers.pdf · 6.1 MB', thread: [\n      { from: \"Kristin Moe\", time: \"Wed 09:50\", body: \"Three tiers, deck attached (also on https://www.rightscon.org/sponsor-2027). My recommendation and the thinking behind it below, because the difference between them is not just price.\\n\\nRightsCon is the one conference where our audience and our press are in the same room. Last year we went as attendees and came home with two partnership conversations and the Access Now quote we still use. Sponsoring changes the footing: we stop asking for meetings and start hosting them.\\n\\nThe Supporter tier (the lowest) is a logo and a table. I would not bother; it reads as a vendor booth and we are not selling to this crowd.\\n\\nThe Partner tier gets us a 25-minute talk slot in the main programme plus the logo placement. The slot is real — it is where the encrypted-DNS panel was last year — and I could fill it with the resolver rollout story with Kjell on stage, which is a story we want told in that room anyway.\\n\\nThe Workshop tier is the most expensive, roughly double Partner, but it doubles our speaking time and gives us a 90-minute hands-on session on day two. What that actually buys is the ability to run a working session with the researchers and civil-society people who evaluate tools like ours, rather than talking at them for 25 minutes. Those are the people who write the guides that send us users we never pay to acquire. I think this tier pays for itself if two of them end up recommending us, and I am fairly confident it would be more than two.\\n\\nThe organisers are holding the workshop slot for us until Friday. After that it goes to the next name on the list, which I gather is a competitor, and I would rather not spend next year's conference watching them run it.\\n\\nIf you want to go cheaper I would take Partner over nothing, but the workshop is the thing I would actually fight for. Happy to walk through the deck whenever suits.\" }] },\n    { id: 'w8', acct: 'w', who: 'Windscribe Status', n: 1, subject: 'Weekly: uptime 99.97%, one incident', t: 18.03, day: 1, labels: [['Infra', 1]], line: 'One 40-min Frankfurt incident, patched Thursday.', body: 'Fleet uptime 99.97%. One unplanned incident, 40 minutes, Frankfurt relay — patched Thursday morning. Full report attached.' },\n    { id: 'w9', acct: 'w', who: 'Marcus Feld', n: 1, subject: 'Intro: Anke Voss, Teleos', t: 14.2, day: 1, labels: [['Partners', 0]], line: 'Anke runs partnerships at Teleos; over to you two.', body: 'Meet Anke (https://www.linkedin.com/in/anke-voss-teleos) — she runs partnerships at Teleos and has followed Windscribe since the router firmware demo. Anke, I will let the two of you take it from here.' },\n    { id: 'w10', acct: 'w', who: 'Northbridge Insurance', n: 1, subject: 'Cyber cover renewal — quote attached', t: 10.1, day: 2, labels: [['Finance', 1], ['Receipts', 1]], line: 'Renews 1 Oct · 38,400 CAD (+4%) · no cover changes.', att: 'Renewal-2026.pdf · 410 KB', body: 'Your policy renews 1 October. Review your quote: http://northbridge-renewals.co/q/38400?id=wsc-2026 Premium 38,400 CAD, up 4% on last year. No changes to cover; the quote is attached.' },\n    { id: 'c1', acct: 'c', who: 'Tomas Berg', n: 1, subject: 'Friday: pilot call moved to 16:30', t: 8.78, day: 0, star: true, labels: [['Partners', 0]], line: 'Kjell asked for later; Legal at 17:00 moved to Monday.', sum: 'The Nordic ISP pilot call moved to 16:30; Legal at 17:00 is cleared and can do Monday.', body: 'Kjell asked for later, so I took the 16:30 slot and cleared your 17:00 with Legal — they can do Monday. New invite: https://meet.google.com/xkp-rtqa-vnd' },\n    { id: 'c2', acct: 'c', who: 'Kjell Aasland', cc: ['Tomas Berg'], n: 5, subject: 'Re: Resolver rollout — Nordic ISP pilot', t: 8.33, day: 0, unread: true, labels: [['Partners', 0], ['Legal', 1]], line: 'Commits to the two-region pilot if anycast is live before November.', sum: 'Kjell commits to the two-region pilot if the Oslo and Bergen anycast nodes are live before November; Procurement wants the DPA referenced in the MSA.', thread: [\n      { from: \"Kjell Aasland\", time: \"Tue 09:20\", body: \"Following up from Oslo. Our network team is comfortable with the resolver design; the open items on our side are anycast coverage for the two regions and how the DPA is referenced from the MSA.\\nCould you confirm timelines for the Oslo and Bergen nodes?\" },\n      { from: \"You\", time: \"Tue 13:47\", body: \"Kjell — Oslo is racked and goes live end of this month. Bergen is dependent on the colo contract; we expect it live by the second week of October, worst case end of October.\\nOn the DPA: Legal is countersigning this week and will send the reference language for the MSA.\" },\n      { from: \"Kjell Aasland\", time: \"Wed 08:55\", body: \"Thank you. End of October for Bergen works if it does not slip further — our internal deadline for the pilot decision is 1 November.\" },\n      { from: \"Tomas Berg\", time: \"Wed 15:30\", body: \"Adding for visibility: DPA countersigned and filed today. Kjell, the MSA reference language is in the redlines Dana sent; Legal will confirm on the call Friday.\" },\n      { from: \"Kjell Aasland\", time: \"Fri 08:20\", body: \"We can commit to the two-region pilot if the Oslo and Bergen anycast nodes are live before November. Procurement wants the DPA referenced in the MSA — I understand Legal has that countersigned now.\\nLet us confirm the date on the call this afternoon.\" }] },\n    { id: 'c3', acct: 'c', who: 'Dana Whitfield', cc: ['Control D Legal'], n: 1, subject: 'Enterprise MSA — redlines', t: 22.23, day: 1, unread: true, labels: [['Enterprise', 0], ['Legal', 0]], line: 'SLA moved to 99.99% with credits; wants 30 min Mon or Tue.', sum: 'Redlines: the SLA moves to 99.99% with service credits, the rest is cleanup. Dana asks for 30 minutes Monday or Tuesday.', att: 'MSA-redlines.docx · 92 KB', thread: [\n      { from: \"Dana Whitfield\", time: \"Thu 22:23\", body: \"Attached our redlines to the draft MSA. I want to give you the reasoning rather than make you reverse-engineer it from tracked changes, because a couple of these will look bigger than they are.\\n\\nThe main change is the SLA. We have moved it from 99.9% to 99.99% with service credits, per our conversation in Oslo. I know that sounds like a tenfold ask; in practice it reflects how the resolver is positioned internally here. It is going in front of every enterprise customer as the first hop for all DNS, which means that when it fails, everything fails, and our own SLA to those customers is written at 99.99%. We cannot sit on a vendor SLA looser than the one we sell. The credit schedule is deliberately gentle — 5% of monthly fees per 0.01% under the line, capped at 30% — because the point is alignment, not revenue.\\n\\nSecond, the data processing terms. Our privacy team asked that the DPA be incorporated by reference rather than attached as a schedule, so that updates to it do not require re-papering the MSA. Section 12.3 now points at the countersigned DPA by date. If your side prefers a schedule we can live with it, but the reference approach is what we do with the other two vendors in this category.\\n\\nThird, termination for convenience. We have added a 90-day notice provision, mutual. I expect pushback and I am open to 180, but the current draft has no exit at all outside of breach, which our board will not accept for a three-year term.\\n\\nThe rest is cleanup: defined-term consistency, the governing law clause now correctly says Ontario throughout, and we struck the marketing clause in 14.2 because nobody on either side actually wants to use it.\\n\\nDo you have 30 minutes Monday or Tuesday to walk through it? I would rather talk than trade another round of redlines.\" }] },\n    { id: 'c4', acct: 'c', who: 'Tomas Berg', n: 3, subject: 'SOC 2 — evidence checklist', t: 15.4, day: 2, star: true, labels: [['Enterprise', 0]], line: 'Four items on you: access reviews, vendor list, two sign-offs.', sum: 'Eleven evidence items still open; four need you — access reviews, the vendor list and two policy sign-offs.', thread: [\n      { from: \"Tomas Berg\", time: \"Mon 09:00\", body: \"Kicking off SOC 2 Type II evidence collection. Auditor window opens 1 October. I have mapped 38 controls to owners; checklist is in the compliance folder. I will nudge weekly.\" },\n      { from: \"You\", time: \"Mon 10:12\", body: \"Good. Put mine at the top of the list so I can batch them one afternoon.\" },\n      { from: \"Tomas Berg\", time: \"Wed 15:24\", body: \"Eleven items open, four on you: the quarterly access reviews for the admin panel and AWS, the current vendor list with owners, and the two policy sign-offs (incident response, data retention). Everything else I can close by Friday.\\nIf you can do yours before Thursday I can send the auditor the full set in one go.\" }] },\n    { id: 'c5', acct: 'c', who: 'Stripe', n: 1, subject: 'Your September invoice is ready', t: 15, day: 1, labels: [['Receipts', 1]], line: 'Invoice CD-0926 · 4,120 USD · scheduled 15 Sep.', body: 'Control D Inc. — invoice CD-0926 for 4,120.00 USD is available. Payment is scheduled for 15 September.' },\n    { id: 'c6', acct: 'c', who: 'Control D Legal', n: 1, subject: 'DPA countersigned — Nordic ISP', t: 16.5, day: 2, labels: [['Legal', 0]], line: 'Countersigned copy filed under Customers; Kjell copied.', att: 'DPA-Nordic-ISP-signed.pdf · 1.1 MB', body: 'Countersigned copy attached. Filed under Customers / Nordic ISP. Kjell has been copied.' },\n    { id: 'p1', acct: 'p', who: 'Elin', n: 1, subject: 'Sunday?', t: 7.97, day: 0, unread: true, labels: [['Family', 0]], line: 'Lunch at one on Sunday — bring the good coffee.', body: \"Mum's asking if you're coming Sunday. I said probably. Prove me right — lunch is at one, and bring the good coffee.\" },\n    { id: 'p2', acct: 'p', who: 'Hanna Berge', n: 2, subject: 'Kitchen: contractor Thursday 8 am', t: 11.17, day: 2, star: true, labels: [['Home', 0]], line: 'Thursday 8:00; needs the fuse box and about two hours.', thread: [\n      { from: \"Hanna Berge\", time: \"Fri 10:02\", body: \"Spoke to the contractor about the kitchen — he can do the electrics next week. Thursday or Friday morning; he needs someone home for the first hour.\" },\n      { from: \"Hanna Berge\", time: \"Sun 11:10\", body: \"Confirming Thursday at 8. He will need access to the fuse box and about two hours. I can be there if you have a call.\" }] },\n    { id: 'p3', acct: 'p', who: 'Nils', n: 1, subject: 'Booked: Richmond St, 19:00', t: 17.67, day: 1, labels: [], line: 'Table for two, window side — do not be late.', body: 'Table for two, window side. Do not be late this time. https://www.opentable.ca/r/richmond-station-toronto' },\n    { id: 'p4', acct: 'p', who: 'Air Canada', n: 1, subject: 'Booking confirmed — YYZ to SFO, 22 Sep', t: 9.4, day: 5, star: true, labels: [['Travel', 1], ['Receipts', 1]], line: 'AC759 · YYZ 08:40 → SFO 11:25 · ref 5KQ2LM.', body: 'AC759 departs Toronto 08:40, arrives San Francisco 11:25. Booking reference 5KQ2LM.', html: '<div style=\"font-family:Helvetica,Arial,sans-serif;max-width:560px;background:#fff;color:#1a1a1a;border-radius:8px;overflow:hidden;border:1px solid #e3e3e3\"><div style=\"background:#c8102e;color:#fff;padding:18px 24px;font-size:18px;font-weight:700;letter-spacing:-.01em\">AIR CANADA<\u002Fdiv><div style=\"padding:24px\"><div style=\"font-size:22px;font-weight:700;margin-bottom:4px\">Your booking is confirmed<\u002Fdiv><div style=\"font-size:13px;color:#666;margin-bottom:22px\">Reference <b style=\"color:#1a1a1a\">5KQ2LM<\u002Fb> · Economy Flex<\u002Fdiv><table style=\"width:100%;border-collapse:collapse;font-size:14px\"><tr><td style=\"padding:14px 0;border-top:1px solid #eee;border-bottom:1px solid #eee;width:34%\"><div style=\"font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.06em\">Depart<\u002Fdiv><div style=\"font-size:26px;font-weight:700;line-height:1.1;margin-top:4px\">YYZ<\u002Fdiv><div style=\"color:#444\">Toronto · 08:40<\u002Fdiv><\u002Ftd><td style=\"padding:14px 0;border-top:1px solid #eee;border-bottom:1px solid #eee;text-align:center;color:#c8102e;font-size:13px;font-weight:700\">AC759<div style=\"height:2px;background:#c8102e;margin:8px 12px;opacity:.35\"><\u002Fdiv>5 h 45 min<\u002Ftd><td style=\"padding:14px 0;border-top:1px solid #eee;border-bottom:1px solid #eee;width:34%;text-align:right\"><div style=\"font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.06em\">Arrive<\u002Fdiv><div style=\"font-size:26px;font-weight:700;line-height:1.1;margin-top:4px\">SFO<\u002Fdiv><div style=\"color:#444\">San Francisco · 11:25<\u002Fdiv><\u002Ftd><\u002Ftr><\u002Ftable><div style=\"display:flex;gap:24px;margin-top:18px;font-size:13px;color:#444\"><div><div style=\"font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.06em\">Date<\u002Fdiv>Tue 22 Sep 2026<\u002Fdiv><div><div style=\"font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.06em\">Seat<\u002Fdiv>14C · aisle<\u002Fdiv><div><div style=\"font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.06em\">Bags<\u002Fdiv>1 checked<\u002Fdiv><\u002Fdiv><a style=\"display:inline-block;margin-top:24px;padding:11px 20px;background:#1a1a1a;color:#fff;border-radius:4px;font-size:13px;font-weight:700;text-decoration:none\">Manage booking<\u002Fa><\u002Fdiv><div style=\"padding:14px 24px;background:#f6f6f6;font-size:11px;color:#888;line-height:1.5\">Check-in opens 24 hours before departure. This is an automated message — replies are not monitored.<\u002Fdiv><\u002Fdiv>' },\n    { id: 'w11', acct: 'w', who: 'Sam Okoro', n: 2, subject: 'Re: Amsterdam pool — capacity plan Q4', t: 15.2, day: 4, star: true, labels: [['Infra', 0]], line: 'Adds 12 servers in October; Hetzner quote attached.', att: 'AMS-capacity-Q4.xlsx · 88 KB', thread: [\n      { from: \"Sam Okoro\", time: \"Tue 10:15\", body: \"Amsterdam is at 71% peak utilisation and October is streaming season. I would like to add capacity before, not after. Drafting a plan.\" },\n      { from: \"Sam Okoro\", time: \"Thu 15:12\", body: \"Plan is 12 more servers in Amsterdam in October, ahead of the streaming season. Hetzner quote attached; same per-unit price as Frankfurt. Lead time is three weeks from PO, so a decision by the 20th keeps us ahead of the curve.\" }] },\n    { id: 'w12', acct: 'w', who: 'Priya Natarajan', n: 3, subject: 'Router firmware 1.8 — release notes', t: 11.4, day: 6, labels: [['Apps', 0]], line: 'Final notes for the 1.8 firmware; ships Tuesday.', thread: [\n      { from: \"Priya Natarajan\", time: \"Mon 09:30\", body: \"Draft release notes for router firmware 1.8 are up for review. Three headline items: split tunnelling by device, faster reconnect on ISP drops, Control D toggle. Beta group has had it two weeks with no blockers.\" },\n      { from: \"You\", time: \"Mon 12:05\", body: \"Lead with reconnect — that is the complaint we hear most. Split tunnelling second. Keep it short.\" },\n      { from: \"Priya Natarajan\", time: \"Tue 11:24\", body: \"Final release notes for 1.8 (also at https://windscribe.com/changelog/router-1-8): faster reconnect on ISP drops, split tunnelling by device, and the Control D toggle. Reordered per your note and cut it to a screen. Ships Tuesday morning; the changelog post goes out an hour after.\" }] },\n    { id: 'w13', acct: 'w', who: 'Marcus Feld', n: 1, subject: 'Board pack — August', t: 9.8, day: 9, star: true, labels: [['Finance', 1], ['Planning', 0]], line: 'August pack sent to the board; ARR +2.1% MoM.', att: 'Board-Aug-2026.pdf · 3.1 MB', thread: [\n      { from: \"Marcus Feld\", time: \"Mon 09:48\", body: \"Pack went out to the board this morning: https://drive.google.com/file/d/1bXq-board-pack-aug-2026/view Slides attached for your file, but here is the narrative so you do not need to open them before the call.\\n\\nARR is up 2.1% month on month to 21.4M CAD, which is in line with the summer trend and slightly ahead of the plan we set in April. Pro conversions are doing most of the work; the free-to-paid rate ticked up 30 basis points after the paywall copy change and has held there for six weeks, so I am now calling it real rather than noise. Team plan is flat, which is fine — we have not touched it — but it will come up because Anke's board seat is reserved for exactly that question.\\n\\nChurn is flat at 2.3% monthly. Underneath, involuntary churn improved (the Stripe retry changes are working; recovered revenue is up about 40k a month) and voluntary churn worsened by a similar amount. The exit survey is consistent: speed on mobile. I have asked Priya for a one-slide view of where the reconnect work lands so we can answer that without hand-waving.\\n\\nCash is unchanged at 19 months of runway at current burn. We are still not spending the marketing line we approved in Q1, and I expect that to be the pointed question from Rob. My honest answer is that we have not found a channel that returns better than the product work does, and I would rather say that than spend it to look busy. If you disagree, tell me before Thursday so we present a united view.\\n\\nHiring is on plan: 46 heads, three open roles, all in Support and Infra. Nothing exotic.\\n\\nThe one item I flagged as a risk is Frankfurt. The bare-metal renewal is up 18% and Sam's case for splitting the pool across two providers is good, but it means a quarter of ops attention for six weeks during streaming season. I presented it as a decision for September rather than a problem, but expect questions.\\n\\nCall is Thursday 15:00. I will hold the first ten minutes for you.\" }] },\n    { id: 'w14', acct: 'w', who: 'Aisha Rahman', n: 2, subject: 'Offer accepted — Lena Brandt (Support)', t: 14.6, day: 13, labels: [['Hiring', 0]], line: 'Lena starts 6 October; onboarding plan drafted.', thread: [\n      { from: \"Aisha Rahman\", time: \"Tue 09:50\", body: \"Offer for Lena Brandt (Support) went out this morning at the number we agreed. She asked for 48 hours to talk to her current team.\" },\n      { from: \"Aisha Rahman\", time: \"Thu 14:36\", body: \"Lena accepted this afternoon. Start date 6 October. Onboarding plan is drafted; I will share it with the leads on Monday. She asked to be introduced to Sam before day one — I will set that up.\" }] },\n    { id: 'w15', acct: 'w', who: 'Stripe', n: 1, subject: 'Your August payout summary', t: 7.1, day: 15, labels: [['Finance', 1], ['Receipts', 1]], line: '1,842,300 CAD settled across 31 payouts.', body: '31 payouts settled in August for a total of 1,842,300 CAD. Fees and disputes are itemised in the attached statement.' },\n    { id: 'w16', acct: 'w', who: 'Kristin Moe', n: 4, subject: 'Press: The Verge on VPN audits', t: 12.9, day: 22, labels: [['Press', 0]], line: 'Quote approved; piece ran Thursday, link inside.', body: 'The piece ran Thursday with your quote intact. Link inside. Two follow-up requests from smaller outlets; I am handling those.' },\n    { id: 'w17', acct: 'w', who: 'Sam Okoro', n: 5, subject: 'Post-mortem: 14 Aug DNS outage', t: 16.3, day: 29, labels: [['Infra', 0]], line: 'Root cause was a stale resolver config; three fixes shipped.', att: 'PM-2026-08-14.pdf · 640 KB', body: 'Post-mortem attached. Root cause: stale resolver config pushed to two regions. Three fixes shipped — config validation, staged rollout, and an alert on resolver error rate.' },\n    { id: 'w18', acct: 'w', who: 'Tomasz Nowak', n: 2, subject: 'iOS 3.1 shipped — first-week numbers', t: 10.2, day: 47, labels: [['Apps', 0]], line: 'Crash-free 99.6%; paywall conversion +0.8 pt.', body: '3.1 is a week old. Crash-free sessions at 99.6%, paywall conversion up 0.8 points, two one-star reviews about the new icon. Full dashboard linked.' },\n    { id: 'w19', acct: 'w', who: 'Marcus Feld', n: 3, subject: 'H2 plan — final', t: 13.5, day: 71, labels: [['Planning', 0]], line: 'H2 plan locked; three bets, one hire per bet.', att: 'H2-2026-plan.pdf · 1.2 MB', body: 'Locked. Three bets — Control D bundle, router channel, enterprise pilot — and one hire against each. Final deck attached.' },\n    { id: 'w20', acct: 'w', who: 'Northbridge Insurance', n: 1, subject: 'Cyber cover — 2025 renewal confirmed', t: 9.4, day: 347, labels: [['Finance', 1], ['Receipts', 1]], line: 'Policy renewed for 2025–26; certificate attached.', att: 'Certificate-2025.pdf · 220 KB', body: 'Your policy is renewed for the 2025–26 term. Certificate of insurance attached for your records.' },\n    { id: 'w21', acct: 'w', who: 'Maya Lindqvist', n: 6, subject: 'Q3 2025 infra review — final', t: 15.7, day: 366, labels: [['Infra', 0], ['Finance', 1]], line: 'Last year’s Q3 review; Frankfurt move approved then.', att: 'Q3-2025-infra-final.pdf · 3.8 MB', body: 'Final version of last year’s Q3 infra review, for reference. This was where we approved the Frankfurt bare-metal move.' },\n    { id: 'w22', acct: 'w', who: 'Sam Okoro', n: 2, subject: 'WireGuard relay 2.0 — rollout complete', t: 8.9, day: 742, labels: [['Infra', 0]], line: 'Fleet moved to 2.0 in 2024; no rollback needed.', body: 'Fleet is fully on relay 2.0 as of this morning. No rollbacks. Closing the ticket.' },\n    { id: 'c9', acct: 'c', who: 'Dana Whitfield', n: 2, subject: 'Enterprise pilot — SOW signed', t: 11.1, day: 5, labels: [['Enterprise', 0], ['Legal', 1]], line: 'SOW countersigned; kick-off 22 September.', att: 'SOW-Nordic-ISP.pdf · 380 KB', body: 'Countersigned SOW attached. Kick-off is 22 September, 14:00 their time. I will send the invite.' },\n    { id: 'c10', acct: 'c', who: 'Fastmail', n: 1, subject: 'Receipt — Control D workspace, September', t: 6.4, day: 12, labels: [['Receipts', 1]], line: '18 seats · 90 USD.', body: 'Your September invoice for 18 seats, 90 USD, has been paid. Receipt
