[workspace]
members = ["crates/fm-*"]
exclude = ["crates/fm-calendar/vendor/rrule"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# RSA key generation is unusably slow unoptimized; keep it fast in dev builds
# and tests.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# Exported secret keys hash their passphrase over 65 MiB (the highest
# iterated S2K count); unoptimized SHA-256 makes that take many seconds.
[profile.dev.package.sha2]
opt-level = 3
